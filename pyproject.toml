[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "statement-ratios"
version = "0.1.0"
description = "Zero-dependency financial statement ratio analysis: liquidity, leverage, DuPont, Altman Z, Piotroski F and trends."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Adham Karim" }]
keywords = ["finance", "ratios", "dupont", "altman", "piotroski", "financial-statements"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/adhamkarim4815/statement-ratios"

[project.scripts]
statement-ratios = "statement_ratios.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statement_ratios = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
